{% extends "layout.html" %}

{% block content %}
<div class="page">
  <h1>Choose Your Race</h1>
  <form method="post">
    <select name="race">
      <option value="">-- Select a race --</option>
      {% for race in races %}
        <option value="{{ race.name }}">{{ race.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Next</button>
  </form>
</div>
{% endblock %}
