{% extends "layout.html" %}

{% block content %}
<div class="page">
  {% set step = 3 %}
  {% include "steps.html" %}
  <h1>Choose Your Class</h1>
  <form method="post">
    <select name="class_" required>
      <option value="">-- Select a class --</option>
      {% for class_ in classes %}
        <option value="{{ class_.name }}" {% if class_.name == selected %}selected{% endif %}>{{ class_.name | title }} (d{{ class_.hit_die.split("d")[1] }})</option>
      {% endfor %}
    </select>
    <div class="form-nav">
      <a href="/create/race" class="back">&larr; Back</a>
      <button type="submit">Next</button>
    </div>
  </form>
</div>
{% endblock %}
