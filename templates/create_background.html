{% extends "layout.html" %}

{% block content %}
<div class="page">
  <h1>Choose Your Background</h1>
  <form method="post">
    <select name="background">
      <option value="">-- Select a background --</option>
      {% for background in backgrounds %}
        <option value="{{ background.name }}">{{ background.name }}</option>
      {% endfor %}
    </select>
    <button type="submit">Next</button>
  </form>
</div>
{% endblock %}
